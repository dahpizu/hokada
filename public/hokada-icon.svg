  <path d="M273 207 L310 235"
        stroke="#071b12" stroke-width="11" stroke-linecap="round"/>

  <!-- Delivery box -->
  <rect x="147" y="192" width="76" height="66" rx="10"
        fill="#071b12" stroke="#8cff72" stroke-width="7"/>
  <path d="M163 210 H207 M163 226 H199"
        stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>

  <!-- Motion accents -->
  <path d="M101 278 H133 M91 300 H119"
        stroke="#8cff72" stroke-width="9" stroke-linecap="round"/>
