        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Rider -->
  <circle cx="252" cy="153" r="34" fill="#071b12"/>
  <path d="M222 153 Q220 119 252 119 Q284 119 284 153
           L271 162 L228 162 Z"
        fill="#ffffff"/>
  <path d="M226 151 L270 151"
