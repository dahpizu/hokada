<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="108" fill="#071b12"/>

  <circle cx="256" cy="256" r="196" fill="#19b85a"/>

  <!-- Wheels -->
  <circle cx="148" cy="342" r="48" fill="#071b12"
          stroke="#ffffff" stroke-width="12"/>
  <circle cx="365" cy="342" r="48" fill="#071b12"
          stroke="#ffffff" stroke-width="12"/>
  <circle cx="148" cy="342" r="13" fill="#8cff72"/>
  <circle cx="365" cy="342" r="13" fill="#8cff72"/>

  <!-- Motorcycle frame -->
  <path d="M148 342 L205 265 L280 342 L224 342 L184 294
           M280 342 L326 266 L365 342"
        fill="none" stroke="#ffffff" stroke-width="16"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Seat and fuel tank -->
  <path d="M190 265 L226 265 L245 286 L213 294 Z"
        fill="#071b12"/>
  <path d="M242 275 Q260 252 292 275 L280 299 L247 299 Z"
